name: CI Security & Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Security, Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run type-check

      - name: ESLint Static Analysis
        run: npm run lint

      - name: Vitest Automated Unit & Regression Tests
        run: npm test

      - name: Next.js Production Build Gate
        run: npm run build

      - name: Dependency Supply Chain Security Audit
        run: npm audit --audit-level=critical || true
